<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevConnect Prototype</title>
  <style>
    :root {
      --green-700:#087a45; --green-600:#0aa85f; --green-500:#16c772; --green-400:#45dc93;
      --green-200:#b9f4d3; --green-100:#ddfae9; --green-50:#f2fcf6;
      --ink:#102a20; --muted:#64756d; --line:#dce8e1; --surface:#ffffff; --canvas:#f7fbf8;
      --danger:#cf3e52; --warn:#bd6c09; --shadow:0 18px 48px rgba(22, 74, 48, .10);
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit} button{cursor:pointer}.app{min-height:100vh}
    .topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 62px;position:relative;z-index:3}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.4px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,var(--green-500),#8aecb8);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 8px 18px rgba(22,199,114,.28)}
    .nav{display:flex;align-items:center;gap:30px;color:#566a60;font-size:14px;font-weight:600}.nav .active{color:var(--green-700)}
    .actions{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--green-100);color:var(--green-700);display:grid;place-items:center;font-weight:800;font-size:13px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 17px;font-weight:750;font-size:14px}.btn.primary{border-color:var(--green-500);background:var(--green-500);color:#fff;box-shadow:0 8px 18px rgba(22,199,114,.2)}.btn.ghost-green{color:var(--green-700);border-color:var(--green-200);background:var(--green-50)}
    .page{max-width:1316px;margin:0 auto;padding:34px 38px 54px}.eyebrow{color:var(--green-700);font-size:12px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}.muted{color:var(--muted)}
    h1,h2,h3,p{margin-top:0}h1{font-size:47px;line-height:1.08;letter-spacing:-1.8px;margin-bottom:18px}h2{font-size:27px;letter-spacing:-.8px;margin-bottom:18px}h3{font-size:17px;line-height:1.35;margin-bottom:9px}.small{font-size:12px}
    .hero{background:linear-gradient(125deg,#effcf4 0%,#e3faed 66%,#c6f6dc 100%);border:1px solid var(--green-200);border-radius:26px;min-height:285px;padding:46px 50px;display:grid;grid-template-columns:1.25fr .75fr;gap:38px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
    .hero:after{content:"";position:absolute;width:330px;height:330px;border:58px solid rgba(22,199,114,.12);border-radius:50%;right:-55px;top:-95px}.hero p{max-width:650px;line-height:1.7;color:#4f665b;margin-bottom:24px}.searchbar{display:flex;background:#fff;border:1px solid #bfe6cf;border-radius:13px;padding:6px;max-width:670px;box-shadow:0 12px 28px rgba(18,91,56,.08)}.searchbar input{border:0;outline:0;flex:1;padding:8px 14px;color:var(--ink);background:transparent}.searchbar .btn{padding:11px 24px}
    .hero-panel{align-self:center;position:relative;z-index:1;background:#fff;border:1px solid rgba(255,255,255,.85);border-radius:20px;padding:23px;box-shadow:0 18px 34px rgba(15,113,65,.12)}.code{background:#0e3426;color:#dffbea;border-radius:14px;padding:18px;font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace}.code .green{color:#71e5a4}.code .dim{color:#9dbbac}.tip{display:flex;gap:12px;margin-top:15px;align-items:center}.tip-icon{width:38px;height:38px;border-radius:11px;background:var(--green-100);display:grid;place-items:center;color:var(--green-700);font-weight:900}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:34px 0 16px}.link{color:var(--green-700);font-weight:750;font-size:14px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:8px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:#4a6256;font-weight:650}.chip.active,.tag{background:var(--green-100);border-color:var(--green-200);color:var(--green-700)}
    .home-grid{display:grid;grid-template-columns:1fr 310px;gap:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(26,76,50,.045)}.thumb{height:94px;border-radius:12px;background:linear-gradient(145deg,#dff8e9,#f4fdf7);display:flex;align-items:end;padding:13px;margin-bottom:16px}.thumb-code{background:#123b2c;color:#caf5dd;border-radius:7px;padding:6px 9px;font:11px ui-monospace,monospace}.meta{display:flex;align-items:center;justify-content:space-between;color:#73877d;font-size:11px}.author{display:flex;align-items:center;gap:9px}.avatar.sm{width:28px;height:28px;font-size:10px}.side-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.series-item{display:grid;grid-template-columns:34px 1fr;gap:11px;padding:14px 0;border-bottom:1px solid #edf3ef}.series-item:last-child{border:0}.num{width:31px;height:31px;border-radius:9px;background:var(--green-100);display:grid;place-items:center;color:var(--green-700);font-weight:850;font-size:11px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.article{background:#fff;border:1px solid var(--line);border-radius:20px;padding:38px 48px}.article h1{font-size:42px}.article-body{font-size:16px;line-height:1.8;color:#3d5147}.article-body h2{margin-top:32px}.author-line{display:flex;align-items:center;gap:12px;margin:20px 0 26px}.article-rule{border:0;border-top:1px solid var(--line);margin:24px 0}.article .code{font-size:14px;margin:20px 0}.reaction-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.reaction{padding:13px;border:1px solid var(--line);border-radius:11px;text-align:center;font-size:13px;font-weight:750;background:#fff}.reaction.active{background:var(--green-100);border-color:var(--green-200);color:var(--green-700)}.sticky{position:sticky;top:20px;align-self:start;display:grid;gap:16px}.comment{border:1px solid var(--line);background:var(--green-50);padding:14px;border-radius:13px;margin-top:12px}
    .editor-shell{max-width:1390px;margin:0 auto;padding:28px 34px 42px}.editor-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.form-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.field label{display:block;font-size:11px;letter-spacing:1px;font-weight:850;color:#64766d;margin-bottom:8px}.input{width:100%;border:1px solid #cfe0d6;background:#fff;border-radius:10px;padding:13px 15px;color:var(--ink);outline:0}.input:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(22,199,114,.14)}.editor-box{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.toolbar{height:52px;background:#f2f8f4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 15px}.tool{width:34px;height:32px;border:1px solid transparent;border-radius:8px;display:grid;place-items:center;color:#3d564a;font-weight:800}.tool:hover{background:#fff;border-color:var(--line)}.editor-columns{display:grid;grid-template-columns:1fr 1fr;min-height:520px}.markdown{border:0;resize:none;padding:26px;font:14px/1.75 ui-monospace,SFMono-Regular,monospace;color:#294238;outline:0}.preview{border-left:1px solid var(--line);padding:30px 34px}.preview h1{font-size:32px}.preview p{line-height:1.8;color:#485d52}.statusbar{display:flex;justify-content:space-between;padding:11px 18px;border-top:1px solid var(--line);font-size:11px;color:#768a80;background:#fbfdfc}
    .dashboard{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 74px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:28px 20px}.side-title{font-size:11px;letter-spacing:1.2px;font-weight:850;color:#8a9a92;margin:0 12px 12px}.side-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:#50645a;font-weight:650;margin:4px 0}.side-link.active{background:var(--green-100);color:var(--green-700)}.dash-content{padding:34px 38px}.dash-title{display:flex;align-items:center;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px}.stat strong{display:block;font-size:30px;margin-top:8px}.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#829187;font-size:11px;letter-spacing:.8px;padding:12px 10px;border-bottom:1px solid var(--line)}.table td{padding:17px 10px;border-bottom:1px solid #edf2ef;font-size:13px}.status{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}.published{background:var(--green-100);color:var(--green-700)}.draft{background:#fff4d8;color:#996008}.hidden{background:#ffe4e7;color:#a92f41}.sort-item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0;background:#fbfefc}.drag{color:#a1b0a8;font-size:18px}.progress{height:7px;background:#eaf1ed;border-radius:999px;overflow:hidden;margin-top:10px}.progress>span{display:block;height:100%;background:var(--green-500);width:72%}
    .admin-filter{display:grid;grid-template-columns:1.4fr .55fr .55fr auto;gap:12px;margin-bottom:18px}.admin-grid{display:grid;grid-template-columns:1fr 370px;gap:20px}.moderation-row{display:grid;grid-template-columns:1.7fr .7fr .55fr .7fr;gap:12px;align-items:center;padding:16px 10px;border-bottom:1px solid #edf2ef;font-size:13px}.moderation-row.head{color:#829187;font-size:11px;font-weight:850;letter-spacing:.7px;background:#f6faf7;border-radius:10px;padding:12px 10px}.inline-actions{display:flex;gap:10px;font-weight:750}.green-text{color:var(--green-700)}.warn-text{color:var(--warn)}.danger-text{color:var(--danger)}.tag-row{display:grid;grid-template-columns:1fr 70px 70px;gap:10px;padding:14px 0;border-bottom:1px solid #edf2ef;font-size:13px;align-items:center}.swatch{width:16px;height:16px;border-radius:5px;background:var(--green-500)}
    @media(max-width:900px){.topbar{padding:0 20px}.nav{display:none}.page{padding:24px 18px}.hero{grid-template-columns:1fr;padding:32px 25px}.hero-panel{display:none}.home-grid,.layout,.dash-grid,.admin-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr}.sidebar{display:none}.stats{grid-template-columns:1fr 1fr}.editor-columns{grid-template-columns:1fr}.preview{border-left:0;border-top:1px solid var(--line)}.form-grid{grid-template-columns:1fr}.article{padding:28px 22px}.admin-filter{grid-template-columns:1fr}.moderation-row{grid-template-columns:1.4fr .7fr .7fr}.moderation-row>:nth-child(2){display:none}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const screen = new URLSearchParams(location.search).get('screen') || 'home';
    const btn = (text, cls='') => `<button class="btn ${cls}">${text}</button>`;
    const nav = (active='Khám phá', admin=false) => `<header class="topbar"><div class="brand"><div class="logo">DC</div>DevConnect${admin?'<span class="status hidden" style="margin-left:5px">ADMIN</span>':''}</div><nav class="nav"><span class="${active==='Khám phá'?'active':''}">Khám phá</span><span class="${active==='Chủ đề'?'active':''}">Chủ đề</span><span>Series</span><span class="${active==='Dashboard'?'active':''}">Bài viết của tôi</span></nav><div class="actions">${btn('＋ Viết bài','ghost-green')}<div class="avatar">DQ</div></div></header>`;
    const author = (name='Nguyễn An', initials='NA') => `<div class="author"><div class="avatar sm">${initials}</div><div><strong>${name}</strong><div class="small muted">07/11/2026 · 8 phút đọc</div></div></div>`;
    const articleCard = (tag,title,desc,authorName,code,initials) => `<article class="card"><div class="thumb"><span class="thumb-code">${code}</span></div><span class="eyebrow" style="font-size:10px">${tag}</span><h3 style="margin-top:9px">${title}</h3><p class="small muted" style="line-height:1.55">${desc}</p><div class="meta">${author(authorName,initials)}<b style="color:var(--green-700)">▲ 25</b></div></article>`;
    const home = () => `${nav('Khám phá')}<main class="page"><section class="hero"><div><div class="eyebrow">Cộng đồng công nghệ dành cho bạn</div><h1>Học hỏi, chia sẻ<br>và phát triển cùng nhau.</h1><p>Khám phá bài viết kỹ thuật chất lượng, học theo Series và chia sẻ kiến thức bằng Markdown trong một cộng đồng thân thiện.</p><div class="searchbar"><input aria-label="Tìm kiếm" placeholder="Bạn muốn học gì hôm nay?"><button class="btn primary">⌕&nbsp; Tìm kiếm</button></div></div><div class="hero-panel"><div class="code"><span class="green">const</span> developer = {<br>&nbsp;&nbsp;curiosity: <span class="green">true</span>,<br>&nbsp;&nbsp;learn: () =&gt; explore(),<br>&nbsp;&nbsp;grow: () =&gt; share()<br>};<br><br><span class="dim">// Mỗi chia sẻ, một bước tiến.</span></div><div class="tip"><div class="tip-icon">↗</div><div><strong>Chia sẻ điều bạn biết</strong><div class="small muted">Viết bài, tạo Series, giúp cộng đồng lớn mạnh.</div></div></div></div></section><div class="section-head"><h2>Chủ đề nổi bật</h2><span class="link">Xem tất cả →</span></div><div class="chips"><span class="chip active">Tất cả</span><span class="chip">Python</span><span class="chip">React</span><span class="chip">DevOps</span><span class="chip">AI</span><span class="chip">Next.js</span></div><div class="home-grid"><div><div class="section-head" style="margin-top:10px"><h2>Bài viết mới nhất</h2><span class="link">Khám phá thêm →</span></div><div class="cards">${articleCard('FASTAPI','Xây dựng REST API an toàn với FastAPI','JWT, ownership và validation rõ ràng trong dự án thực tế.','Nguyễn An','app = FastAPI()','NA')}${articleCard('DEVOPS','Docker Compose cho nhóm phát triển nhỏ','Môi trường đồng nhất chỉ trong vài phút.','Trần Bình','docker compose up','TB')}${articleCard('REACT','Quản lý state rõ ràng trong React','Chọn đúng công cụ cho từng loại state.','Lê Minh','const [data] = useState()','LM')}</div></div><aside><div class="section-head" style="margin-top:10px"><h2>Series nổi bật</h2></div><div class="side-card"><div class="series-item"><div class="num">01</div><div><strong>FastAPI từ cơ bản</strong><div class="small muted">8 bài viết</div></div></div><div class="series-item"><div class="num">02</div><div><strong>React thực chiến</strong><div class="small muted">12 bài viết</div></div></div><div class="series-item"><div class="num">03</div><div><strong>Docker cho người mới</strong><div class="small muted">6 bài viết</div></div></div></div></aside></div></main>`;
    const article = () => `${nav('Khám phá')}<main class="page"><div class="layout"><article class="article"><div class="chips"><span class="chip tag">FastAPI</span><span class="chip tag">Python</span><span class="chip">Backend</span></div><h1>Xây dựng REST API an toàn với FastAPI</h1><p class="muted" style="font-size:18px;line-height:1.55">Từ xác thực JWT đến kiểm tra quyền sở hữu dữ liệu — một hướng dẫn thực hành cho nhóm phát triển nhỏ.</p><div class="author-line">${author()}<span class="status published">Published</span></div><hr class="article-rule"><div class="article-body"><p>FastAPI giúp chúng ta xây dựng API rõ ràng bằng type hints và schema validation. Tuy nhiên, một API tốt không chỉ cần chạy được — nó còn phải kiểm tra đúng danh tính, quyền truy cập và dữ liệu đầu vào.</p><h2>Phân quyền cần bắt đầu từ backend</h2><p>Giao diện có thể ẩn nút chỉnh sửa, nhưng backend mới là nơi quyết định người dùng có quyền thay đổi tài nguyên hay không.</p><div class="code"><span class="green">from</span> fastapi <span class="green">import</span> FastAPI, Depends<br><br>app = FastAPI()<br><br><span class="green">@app.get</span>("/health")<br>def health():<br>&nbsp;&nbsp;return {"status": "ok"}</div><h2>Validation rõ ràng, lỗi dễ hiểu</h2><p>Mỗi lỗi validation nên xuất hiện gần trường liên quan và không làm mất những dữ liệu hợp lệ mà người dùng đã nhập.</p></div><hr class="article-rule"><h2 style="font-size:23px">Bình luận</h2><div class="searchbar" style="max-width:none"><input placeholder="Viết câu hỏi hoặc chia sẻ thêm..."><button class="btn primary">Gửi</button></div><div class="comment">${author('Trần Bình','TB')}<p style="margin:11px 0 0;font-size:14px">Phần ownership có cần kiểm tra ở từng endpoint không?</p></div></article><aside class="sticky"><div class="side-card"><div class="eyebrow">Tương tác</div><div class="reaction-grid" style="margin-top:14px"><div class="reaction active">▲ 25</div><div class="reaction">▼ 2</div><div class="reaction" style="grid-column:1/-1">★ Đã lưu</div></div></div><div class="side-card"><div class="eyebrow">Trong Series</div><h3 style="margin-top:13px">FastAPI từ cơ bản đến thực chiến</h3><div class="progress"><span></span></div><p class="small muted" style="margin-top:8px">Bài 5 / 8</p><div class="sort-item">← Bài trước</div><div class="sort-item" style="border-color:var(--green-200);background:var(--green-50);color:var(--green-700)">Bài sau →</div></div><div class="side-card">${author()}<p class="small muted" style="line-height:1.55;margin-top:12px">Backend developer · Chia sẻ kiến thức từ các dự án thực tế.</p>${btn('Theo dõi','ghost-green')}</div></aside></div></main>`;
    const editor = () => `${nav('Dashboard')}<main class="editor-shell"><div class="editor-top"><div><div class="eyebrow">Studio tác giả</div><h2 style="margin:6px 0 0">Soạn thảo bài viết mới</h2></div><div class="actions">${btn('Lưu nháp')} ${btn('Xuất bản','primary')}</div></div><div class="form-grid"><div class="field"><label>TIÊU ĐỀ</label><input class="input" value="Xây dựng REST API an toàn với FastAPI"></div><div class="field"><label>TAGS · TỐI ĐA 5</label><div class="input"><span class="chip tag">Python ×</span> <span class="chip tag">FastAPI ×</span></div></div></div><div class="field" style="margin-top:14px"><label>TÓM TẮT</label><input class="input" value="JWT, ownership và cách tổ chức service rõ ràng trong FastAPI."></div><section class="editor-box"><div class="toolbar"><span class="tool">B</span><span class="tool"><i>I</i></span><span class="tool">H1</span><span class="tool">↗</span><span class="tool">&lt;/&gt;</span><span class="tool">▧</span><span style="margin-left:auto;color:var(--green-700);font-size:12px;font-weight:800">XEM TRƯỚC TRỰC TIẾP</span></div><div class="editor-columns"><textarea class="markdown"># Xây dựng REST API an toàn\n\nFastAPI hỗ trợ **validation** tự động và type hints rõ ràng.\n\n## Phân quyền cần bắt đầu từ backend\n\n\`\`\`python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get('/health')\ndef health():\n    return {'status': 'ok'}\n\`\`\`\n\n> Luôn kiểm tra ownership tại backend.</textarea><div class="preview"><div class="eyebrow">Bản xem trước</div><h1>Xây dựng REST API an toàn</h1><p>FastAPI hỗ trợ <strong>validation</strong> tự động và type hints rõ ràng.</p><h2>Phân quyền cần bắt đầu từ backend</h2><div class="code"><span class="green">from</span> fastapi <span class="green">import</span> FastAPI<br><br>app = FastAPI()<br><br><span class="green">@app.get</span>('/health')</div><div class="comment" style="border-left:4px solid var(--green-500)">Luôn kiểm tra ownership tại backend.</div></div></div><div class="
